<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La Balise Tableau</title>
    </head>
    <body>
        <h2>Un tableau basique en HTML</h2>

        <table border="1">
            <tr>
                <th>Designation</th>
                <th>Prix Unitaire</th>
                <th>Categorie</th>
            </tr>
            <tr>
                <td>iPhone 17 Pro Max</td>
                <td>200 000 F CFA</td>
                <td>Telephone Mobile</td>
            </tr>
            <tr>
                <td>Lenovo iCore 5</td>
                <td>350 000 F CFA</td>
                <td>Ordinateur Portable</td>
            </tr>
        </table>
    </body>
</html>
