        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Un tableau d'Images</title>

                    <img src="images/element-3.png" alt="Image 3" />

            </tr>
            <tr>

                    <img src="images/element-4.png" alt="Image 4" />
                </td>
                <td>
                    <img src="images/element-5.png" alt="Image 5" />
                </td>
                <td>
                    <img src="images/element-6.png" alt="Image 6" />
                </td>
            </tr>
        </table>
    </body>
</html>
